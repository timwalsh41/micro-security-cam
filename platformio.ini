; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = espressif/esp32-camera@^2.0.4
monitor_speed = 115200
lib_ignore = native_mocks embedded_mocks test_utils

[env:seeed_xiao_esp32s3_test]
extends = env:seeed_xiao_esp32s3
lib_ignore = native_mocks   ; this should overwrite lib_ignore from seeed_xiao_esp32s3, and thus
                            ; include embedded_mocks and test_utils libs
test_filter = hardware_tests

[env:native]
platform = native
build_flags =
    -D UNIT_TESTING
    -I include
    -I test
    -I lib/native_mocks
lib_deps = native_mocks
lib_ignore = embedded_mocks
lib_ldf_mode = deep+
build_src_filter = -<*> +<utility.cpp> +<time_service.cpp> +<hal/time_hal.cpp>
test_build_src = yes
test_filter = native/*
