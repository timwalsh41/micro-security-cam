; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps =
    espressif/esp32-camera@^2.0.4
    WiFi
    me-no-dev/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
monitor_speed = 115200
build_flags = -DCAMERA_MODEL_XIAO_ESP32S3

; Dedicated debug environment using the ESP32-S3 built-in USB-JTAG bridge.
; Usage: pio debug -e seeed_xiao_esp32s3_debug
; Requires the board to be connected via USB-C (JTAG is multiplexed on the USB connection).
; If composite CDC+JTAG doesn't work, fall back to an external JTAG probe (e.g. ESP-Prog)
; and change debug_tool to esp-prog below.
[env:seeed_xiao_esp32s3_debug]
extends = env:seeed_xiao_esp32s3

; Override build_flags to add USB composite mode for JTAG.
; The base env only sets CAMERA_MODEL_XIAO_ESP32S3; we append the USB flags here
; so the non-debug build is unaffected.
build_flags =
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEBUG_MODE

; --- Debug tool configuration ---
; Built-in USB-JTAG via the board's USB-C port (no external hardware needed).
; Alternative: esp-prog (requires wiring to JTAG pins GPIO39-42 on the back of the board)
debug_tool = esp-builtin

; --- Debug build flags ---
; Disable optimization and emit maximum debug symbols for reliable stepping/watching.
debug_build_flags = -O0 -g3

; --- Debug session options ---
; Note: debug_init_break is intentionally not set. PlatformIO issues this as a raw GDB
; command and we handle breakpoints in debug_extra_cmds (which runs after the GDB
; connection is established and we've switched to CPU1).
; debug_init_break = none

; When to upload firmware during debug launch.
; 'always' = re-upload every time, 'modified' = only if changed, 'manual' = never auto-upload
debug_load_mode = modified

; JTAG clock speed in kHz. Lower = more reliable, higher = faster stepping.
; Default is usually fine; reduce to 20000 if connection is unstable.
; debug_speed = 20000

; Extra GDB commands executed after connection.
; Switch to CPU1 before setting breakpoints — setup() and loop() run on CPU1.
; Avoid 'monitor reset halt' which triggers a dual-core race condition on ESP32-S3.
debug_extra_cmds =
    monitor targets esp32s3.cpu1
; Add breakpoints at setup() and loop() functions
;    break setup
;    break loop

[env:seeed_xiao_esp32s3_test]
extends = env:seeed_xiao_esp32s3
lib_extra_dirs = test/mocks
; native_mocks provides a mock Arduino.h for the native env; it must not
; be linked into embedded builds where the real Arduino framework exists.
lib_ignore = native_mocks
test_filter = hardware/*
build_flags = ${env:seeed_xiao_esp32s3.build_flags} -I src
; Compile the project src/ modules alongside the test code so the tests
; can link against the real controllers and HAL implementations.
test_build_src = yes
; The firmware main.cpp defines setup()/loop() which conflicts with the
; Unity test entry points; exclude it from the test build.
; Note: the leading +<*> is required — a filter with only negative rules
; matches no files, which breaks LDF dependency scanning (WebServer would
; compile without the WiFi include path).
build_src_filter = +<*> -<main.cpp>

[env:native]
platform = native
build_flags =
    -D UNIT_TESTING
    -I include
    -I test
lib_extra_dirs = test/mocks
lib_ldf_mode = deep+
build_src_filter = -<*> +<logging_service.cpp> +<time_service.cpp> +<led_state_machine.cpp> +<sd_controller.cpp> +<camera_controller.cpp> +<ini_parser.cpp> +<config_service.cpp> +<avi_writer.cpp> +<video_controller.cpp> +<wifi_service.cpp> +<web_server_service.cpp> +<web_auth_util.cpp> +<command_handler.cpp> +<web_command_transport.cpp> +<serial_command_transport.cpp> +<system_orchestrator.cpp> +<time_formatter.cpp> +<path_utils.cpp> +<hal/time_hal.cpp> +<hal/serial_log_backend.cpp> +<hal/serial_hal_impl.cpp> +<hal/gpio_hal.cpp>
test_build_src = yes
test_filter = native/*
