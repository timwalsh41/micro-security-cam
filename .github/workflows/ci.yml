name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native test suite
        run: pio test -e native

  firmware-build:
    name: Firmware build (seeed_xiao_esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-firmware-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-firmware-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e seeed_xiao_esp32s3
