; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = espressif/esp32-camera@^2.0.4
monitor_speed = 115200
build_flags = -DCAMERA_MODEL_XIAO_ESP32S3

[env:seeed_xiao_esp32s3_test]
extends = env:seeed_xiao_esp32s3
lib_extra_dirs = test/mocks
test_filter = hardware_tests

[env:native]
platform = native
build_flags =
    -D UNIT_TESTING
    -I include
    -I test
lib_extra_dirs = test/mocks
lib_ldf_mode = deep+
build_src_filter = -<*> +<utility.cpp> +<time_service.cpp> +<pin_arbitrator.cpp> +<led_state_machine.cpp> +<sd_write_controller.cpp> +<camera_controller.cpp> +<hal/time_hal.cpp>
test_build_src = yes
test_filter = native/*
